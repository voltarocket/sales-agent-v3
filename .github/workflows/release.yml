name: Build & Release Installers

on:
  push:
    tags:
      - "v*"          # trigger on v1.0.0, v1.2.3, etc.

permissions:
  contents: write     # needed to create releases and upload assets

jobs:
  build:
    runs-on: windows-latest   # NSIS requires Windows

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Generate app icons (required by electron-builder NSIS) ─────────────
      - name: Generate icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $apps = @("desktop", "admin", "installer")
          foreach ($app in $apps) {
            New-Item -ItemType Directory -Force "$app\build" | Out-Null
            $bmp = New-Object System.Drawing.Bitmap 256,256
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(124,58,237))
            $g.Dispose()
            $bmp.Save("$app\build\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          Write-Output "Icons generated OK"

      # ── Build Desktop App ───────────────────────────────────────────────────
      - name: Install & build Desktop App
        shell: pwsh
        working-directory: desktop
        run: |
          npm install 2>&1 | Tee-Object -Variable npmOut
          $buildOut = npx electron-builder --win --x64 2>&1
          $buildOut | Write-Output
          if ($LASTEXITCODE -ne 0) {
            "## ❌ Desktop build failed`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $buildOut | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Admin App ─────────────────────────────────────────────────────
      - name: Install & build Admin App
        shell: pwsh
        working-directory: admin
        run: |
          npm install 2>&1 | Write-Output
          $buildOut = npx electron-builder --win --x64 2>&1
          $buildOut | Write-Output
          if ($LASTEXITCODE -ne 0) {
            "## ❌ Admin build failed`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $buildOut | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Backend Installer ─────────────────────────────────────────────
      - name: Install & build Backend Installer
        shell: pwsh
        working-directory: installer
        run: |
          npm install 2>&1 | Write-Output
          $buildOut = npx electron-builder --win --x64 2>&1
          $buildOut | Write-Output
          if ($LASTEXITCODE -ne 0) {
            "## ❌ Installer build failed`n``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $buildOut | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Rename artifacts to stable names ────────────────────────────────────
      - name: Rename artifacts
        shell: pwsh
        run: |
          $desktop = Get-ChildItem "desktop/dist" -Filter "*.exe" | Where-Object { $_.Name -notlike "*Uninstall*" } | Select-Object -First 1
          if ($desktop) { Copy-Item $desktop.FullName "Diallog-Setup.exe" }

          $admin = Get-ChildItem "admin/dist" -Filter "*.exe" | Where-Object { $_.Name -notlike "*Uninstall*" } | Select-Object -First 1
          if ($admin) { Copy-Item $admin.FullName "Diallog-Admin-Setup.exe" }

          $backend = Get-ChildItem "installer/dist" -Filter "*.exe" | Where-Object { $_.Name -notlike "*Uninstall*" } | Select-Object -First 1
          if ($backend) { Copy-Item $backend.FullName "Diallog-Backend-Installer.exe" }

          Get-ChildItem "*.exe"

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Diallog ${{ github.ref_name }}"
          body: |
            ## Diallog ${{ github.ref_name }}

            ### Что скачать

            | Файл | Для кого |
            |------|---------|
            | **Diallog-Setup.exe** | Менеджер — устанавливается на каждый рабочий компьютер |
            | **Diallog-Admin-Setup.exe** | Администратор — панель управления |
            | **Diallog-Backend-Installer.exe** | Локальный сервер — один на офис (требует Docker Desktop) |

            ### Порядок установки
            1. Установите **Docker Desktop** (если ещё не установлен)
            2. Запустите **Diallog-Backend-Installer.exe** — он настроит и запустит сервер
            3. Запишите IP-адрес сервера, который покажет инсталлятор
            4. Установите **Diallog-Admin-Setup.exe** и **Diallog-Setup.exe**, указав этот IP при установке
            5. Войдите в Admin App с email/паролем от сайта
          files: |
            Diallog-Setup.exe
            Diallog-Admin-Setup.exe
            Diallog-Backend-Installer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
