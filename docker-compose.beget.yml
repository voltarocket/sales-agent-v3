# Beget VPS deployment — website only
# Usage: docker compose -f docker-compose.beget.yml up -d --build
#
# Required .env files:
#   website/backend/.env  — set GLOBAL_BACKEND_URL to your VPS address,
#                           GLOBAL_ADMIN_SECRET, SITE_ADMIN_PASS, DOWNLOAD_* URLs
#
# Before building: cd website/frontend && npm install && npm run build
# (builds React into website/backend/static)
#
# NOTE: Beget shared hosting is NOT supported — use Beget VPS or Cloud.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sales_agent
      POSTGRES_USER:     sales
      POSTGRES_PASSWORD: sales_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  website:
    build: ./website/backend
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./website/backend/.env
    environment:
      DATABASE_URL: postgresql://sales:sales_pass@postgres:5432/sales_agent
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
