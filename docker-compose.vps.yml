# Beget VPS deployment — global backend + website + postgres on one server
# Usage: docker compose -f docker-compose.vps.yml up -d --build
#
# Required .env files (copy from .env.example and fill in):
#   global-backend/.env  — set GROQ_API_KEY, ADMIN_SECRET
#   website/backend/.env — set GLOBAL_BACKEND_URL=http://localhost:3002,
#                          GLOBAL_ADMIN_SECRET, SITE_ADMIN_PASS, DOWNLOAD_* URLs
#
# Before starting: build the React frontend once:
#   cd website/frontend && npm install && npm run build
#
# Open ports in VPS firewall: 3002 (global backend), 3003 (website)
# Or put nginx in front on port 80/443 and keep 3002/3003 closed externally.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sales_agent
      POSTGRES_USER:     sales
      POSTGRES_PASSWORD: sales_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  global-backend:
    build: ./global-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./global-backend/.env
    environment:
      DATABASE_URL: postgresql://sales:sales_pass@postgres:5432/sales_agent
    volumes:
      - global_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  website:
    build: ./website/backend
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./website/backend/.env
    environment:
      DATABASE_URL:        postgresql://sales:sales_pass@postgres:5432/sales_agent
      # On the same VPS, website talks to global-backend via Docker network
      GLOBAL_BACKEND_URL:  http://global-backend:3002
    depends_on:
      postgres:
        condition: service_healthy
      global-backend:
        condition: service_started

volumes:
  postgres_data:
  global_uploads:
